[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kiomet-ai"
version = "0.1.0"
description = "Kiomet 模組化控制平台：模擬閉環與獨立瀏覽器"
requires-python = ">=3.12"
dependencies = ["playwright==1.63.0", "psutil==7.2.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
kiomet-ai = "kiomet_ai.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = "runtime/cache/pytest"
